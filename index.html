<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
        }

        .message {
            position: relative;
            z-index: 2;
            margin-top: 40px;
        }

        h1 {
            color: pink;
            font-size: 50px;
            text-shadow: 0 0 20px red;
        }

        p {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <canvas id="heart"></canvas>

    <div class="message">
        <h1>I Love You ❤️</h1>
        <p>I made this just for you.</p>
    </div>

    <script>
        const canvas = document.getElementById("heart");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = [
            "red",
            "pink",
            "cyan",
            "yellow",
            "orange",
            "magenta"
        ];

        function heartX(t) {
            return 16 * Math.pow(Math.sin(t), 3);
        }

        function heartY(t) {
            return 13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t);
        }

        let i = 0;

        function drawHeart() {

            if (i >= 360) return;

            const t = i * Math.PI / 180;

            const x = heartX(t) * 20;
            const y = heartY(t) * 20;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            ctx.fillStyle =
                colors[Math.floor(Math.random() * colors.length)];

            ctx.font = "bold 10px Arial";

            ctx.fillText(
                "I love you",
                centerX + x,
                centerY - y
            );

            i++;

            requestAnimationFrame(drawHeart);
        }

        drawHeart();
    </script>

</body>
</html>
